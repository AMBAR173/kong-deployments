apiVersion: batch/v1
kind: Job
metadata:
  name: gp2-artifact-download-gateway-spec
  namespace: kong-deployments

spec:
  template:
    spec:
      restartPolicy: Never

      containers:
      - name: downloader

        image: curlimages/curl

        command:
        - sh
        - -c
        - |
          echo "Downloading OpenAPI Spec"

          curl -v \
          http://192.168.1.7:8081/repository/kong_config_releases/GP2/gateway-config/gp2_1.0.0.yaml

          echo ""
          echo "Download Completee"